<div class="store-container">
  <!-- Panel Lateral de Filtros -->
  <aside class="filters-sidebar">
    <h3><i class="fas fa-filter"></i> Filtros</h3>

    <!-- Filtro de Precio -->
    <div class="filter-group">
      <label for="priceRange">Rango de Precio: <strong>${{ priceControl.value }}</strong></label>
      <input 
        type="range" 
        id="priceRange" 
        min="0" 
        max="1000" 
        step="10" 
        [formControl]="priceControl"
      />
    </div>

    <!-- Filtro por Categoría -->
    <div class="filter-group">
      <label>Categoría</label>
      <select [formControl]="categoryControl" class="category-select">
        <option value="All">Todas las Categorías</option>
        <option value="Furniture">Muebles</option>
        <option value="Accessories">Accesorios</option>
        <option value="Footwear">Calzado</option>
        <option value="Electronic">Electrónica</option>
        <option value="Bags">Bolsos</option>
      </select>
    </div>
  </aside>

  <main class="catalog-main">
    <!-- Barra de búsqueda superior -->
    <div class="search-bar-container">
      <div class="search-input-wrapper">
        <i class="fas fa-search"></i>
        <input 
          type="text" 
          [formControl]="searchControl" 
          placeholder="Buscar productos por nombre..." 
          class="search-input"
        />
      </div>
      <!-- Contador de productos encontrados -->
      <div class="product-counter" *ngIf="filteredProducts$ | async as productsList">
        <span>Mostrando <strong>{{ productsList.length }}</strong> resultados</span>
      </div>
    </div>

    <!-- Contenedor de Tarjetas (CSS Grid) -->
    <ng-container *ngIf="filteredProducts$ | async as productsList">
      <div class="products-grid" *ngIf="productsList.length > 0; else noResults">
        <div class="product-card" *ngFor="let product of productsList">
          <div class="card-image-container">
            <img [src]="product.image" [alt]="product.name" />
            <span class="product-category-tag">{{ product.category }}</span>
          </div>
          <div class="card-content">
            <h4>{{ product.name }}</h4>
            <p class="product-description">{{ product.description }}</p>
            <div class="card-footer">
              <span class="product-price">${{ product.price }}</span>
              <button class="btn-buy">Comprar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Mensaje cuando no existan coincidencias -->
      <ng-template #noResults>
        <div class="no-results-message">
          <i class="fas fa-box-open"></i>
          <h4>No se encontraron productos</h4>
          <p>Intenta ajustando tus criterios de búsqueda o el rango de precios.</p>
        </div>
      </ng-template>
    </ng-container>
  </main>
</div>
